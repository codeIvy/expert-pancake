<!doctype html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#001a00">
<title>Панель ліфта</title>
<style>
  /* EDIT HERE: код доступу до ліфтового контролера */
  :root { --code: "7734"; }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; background:#000; font-family: "Courier New", monospace; }
  body { display:flex; align-items:center; justify-content:center; }
  .device {
    width:100%; height:100%; max-width:420px; max-height:900px;
    background:#001a00; color:#33ff33; position:relative; overflow:hidden;
    display:flex; flex-direction:column;
  }
  .device::after {
    content:""; position:absolute; inset:0; pointer-events:none;
    background: repeating-linear-gradient(rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.25) 3px);
    mix-blend-mode:multiply;
  }
  .device::before {
    content:""; position:absolute; inset:0; pointer-events:none; z-index:5;
    box-shadow: inset 0 0 120px rgba(0,0,0,0.8);
  }
  header { padding:16px; border-bottom:1px solid #1a5c1a; text-align:center; flex-shrink:0; }
  header a { color:#33ff33; text-decoration:none; font-size:12px; float:left; opacity:0.7; }
  header .title { font-size:14px; letter-spacing:2px; text-shadow:0 0 6px #33ff33; }
  header .sub { font-size:10px; opacity:0.6; margin-top:4px; }
  main { flex:1; overflow-y:auto; padding:20px; position:relative; z-index:2; }

  /* --- lock screen --- */
  #lock { display:flex; flex-direction:column; align-items:center; gap:20px; padding-top:10px; }
  .blink { animation: blink 1.4s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0.2; } }
  #display { font-size:32px; letter-spacing:14px; text-shadow:0 0 10px #33ff33; min-height:40px; }
  #display.err { color:#ff3333; text-shadow:0 0 10px #ff3333; animation: shake 0.3s; }
  @keyframes shake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-8px);} 75%{transform:translateX(8px);} }
  .keypad { display:grid; grid-template-columns:repeat(3,64px); gap:10px; }
  .keypad button {
    width:64px; height:56px; background:#0a2a0a; border:1px solid #33ff33; color:#33ff33;
    font-family:inherit; font-size:20px; border-radius:4px; cursor:pointer;
  }
  .keypad button:active { background:#1a5c1a; }
  .keypad button.wide { grid-column: span 1; font-size:13px; }
  #hint { font-size:11px; opacity:0.5; text-align:center; max-width:280px; }

  /* --- breach animation --- */
  #breach { display:none; padding-top:40px; }
  #breach .line { font-size:13px; margin:6px 0; opacity:0; animation: fadeIn 0.2s forwards; }
  @keyframes fadeIn { to { opacity:1; } }
  .bar { height:10px; border:1px solid #33ff33; margin-top:16px; }
  .bar-fill { height:100%; width:0%; background:#33ff33; transition:width 2s linear; }

  /* --- content --- */
  #content { display:none; }
  #content h2 { font-size:16px; margin-bottom:10px; text-shadow:0 0 6px #33ff33; }
  .floor-list { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:20px; }
  .floor-list div { border:1px solid #1a5c1a; text-align:center; padding:8px 2px; font-size:12px; }
  .floor-list .locked { color:#ff3333; border-color:#ff3333; text-shadow:0 0 6px #ff3333; }
  .floor-list .locked.glitch { animation: glitchText 1.8s infinite; }
  @keyframes glitchText { 0%,90%,100%{ opacity:1; } 92%{ opacity:0.3; transform:translateX(2px); } 94%{ opacity:1; transform:translateX(-2px); } }
  .log { font-size:11px; line-height:1.6; border-top:1px dashed #1a5c1a; padding-top:10px; white-space:pre-wrap; }
  .log .rep { opacity:0.6; }
</style>
</head>
<body>
<div class="device">
  <header>
    <a href="../index.html">← вихід</a>
    <div class="title">КОНТРОЛЕР ЛІФТА</div>
    <div class="sub">Аварійний вузол · Аркологія «Веретено»</div>
  </header>
  <main>
    <div id="lock">
      <div class="blink" style="font-size:11px;">ОЧІКУВАННЯ КОДУ ДОСТУПУ</div>
      <div id="display">____</div>
      <div class="keypad" id="keypad"></div>
      <div id="hint">GM: повідом гравцям код після вдалої перевірки на Взлом.</div>
    </div>

    <div id="breach"></div>

    <div id="content">
      <h2>ДИРЕКТОРІЯ ПОВЕРХІВ</h2>
      <div class="floor-list" id="floors"></div>
      <div class="log" id="syslog"></div>
    </div>
  </main>
</div>

<script>
  const CODE = "7734"; // EDIT: код доступу
  let entered = "";

  const display = document.getElementById('display');
  const keypad = document.getElementById('keypad');
  const keys = ["1","2","3","4","5","6","7","8","9","C","0","OK"];
  keys.forEach(k => {
    const b = document.createElement('button');
    b.textContent = k;
    if (k === "OK") b.classList.add('wide');
    b.onclick = () => handleKey(k);
    keypad.appendChild(b);
  });

  function renderDisplay() {
    display.textContent = (entered + "____").slice(0,4).split("").join(" ");
  }
  renderDisplay();

  function handleKey(k) {
    if (k === "C") { entered = ""; renderDisplay(); return; }
    if (k === "OK") {
      if (entered === CODE) { breach(); }
      else {
        display.classList.add('err');
        setTimeout(()=>{ display.classList.remove('err'); entered=""; renderDisplay(); }, 400);
      }
      return;
    }
    if (entered.length < 4) { entered += k; renderDisplay(); }
  }

  function breach() {
    document.getElementById('lock').style.display = 'none';
    const b = document.getElementById('breach');
    b.style.display = 'block';
    const lines = [
      "з'єднання з контролером ліфта...",
      "обхід протоколу безпеки...",
      "синхронізація з мережею будівлі...",
      "ДОСТУП ДОЗВОЛЕНО"
    ];
    b.innerHTML = `<div class="bar"><div class="bar-fill" id="fill"></div></div>`;
    setTimeout(()=>{ document.getElementById('fill').style.width = '100%'; }, 50);
    lines.forEach((l,i) => {
      setTimeout(()=>{
        const d = document.createElement('div');
        d.className = 'line';
        d.textContent = '> ' + l;
        b.appendChild(d);
      }, 400 + i*500);
    });
    setTimeout(showContent, 400 + lines.length*500 + 400);
  }

  function showContent() {
    document.getElementById('breach').style.display = 'none';
    document.getElementById('content').style.display = 'block';

    const floors = document.getElementById('floors');
    const list = [];
    for (let i=99;i>=1;i--) list.push(i);
    list.push('B1','B2','B3');
    list.slice(0,20).forEach(f => {
      const d = document.createElement('div');
      d.textContent = f;
      floors.appendChild(d);
    });
    const locked = document.createElement('div');
    locked.className = 'locked glitch';
    locked.textContent = '0 · АРХІТЕКТОР';
    floors.appendChild(locked);

    // EDIT HERE: журнал викликів ліфта — підказка про поверх 0
    document.getElementById('syslog').textContent =
`ЛОГ СИСТЕМИ:
12:03 виклик ліфта → поверх 66
12:04 виклик ліфта → поверх 66
12:04 виклик ліфта → поверх 66
12:04 виклик ліфта → поверх 66
...
[ПОМИЛКА ЗАПИСУ] поверх «0» не існує в реєстрі будівлі`;
  }
</script>
</body>
</html>
